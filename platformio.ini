; PlatformIO Project Configuration File
; 录音豆 echo-pod - 阶段2 正式硬件项目
; 硬件：Seeed XIAO ESP32-S3 Sense（焊接版）
;
; 框架配置继承自 recording-pod-hello 验证项目：
;   arduino-esp32 3.3.11 + ghfast.top 镜像 + USB CDC + 8MB OPI PSRAM
; 单步验证固件在 src/step2/，每个测试一个 env

[env:echo-pod]
; 用 ghfast.top 镜像加速 github 下载（国内可直连）
platform = https://ghfast.top/https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://ghfast.top/https://github.com/espressif/arduino-esp32.git#3.3.11

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
; 主固件：编译 src 全部，排除 step2/ 下的单步验证固件（避免 setup/loop 重复定义）
build_src_filter = +<*> -<step2/>

; ===== 阶段2 单步验证固件 =====
; 每个测试一个独立 env，只编译它自己（extends 继承全部构建配置）
; 烧录：pio run -e echo-pod-step2-led -t upload && pio device monitor

[env:echo-pod-step2-led]
extends = env:echo-pod
build_src_filter = +<step2/test_led.cpp>

[env:echo-pod-step2-button]
extends = env:echo-pod
build_src_filter = +<step2/test_button.cpp>
