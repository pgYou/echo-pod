; PlatformIO Project Configuration File
; 录音豆 echo-pod 固件 —— 2.0 硬件：微雪 ESP32-S3-ePaper-1.54（V2，N8R8）
;
; 框架：arduino-esp32 3.3.11 + ghfast.top 镜像 + USB CDC + 8MB OPI PSRAM
; 板级引脚与交互定义见 docs（hardware-spec / interaction-design）
;
; 两个 env，同一份 src：
;   echo-pod        正式版：插线 → SYNC 态（暂停录音，为 v0.2.0 MSC 同步预留）
;   echo-pod-debug  调试版：插线仅=供电+串口，永不进 SYNC，录音/日志不中断
;                   （编译期 POD_DEBUG=1，烧录加 -e echo-pod-debug）

[env]
; 用 ghfast.top 镜像加速 github 下载（国内可直连）
platform = https://ghfast.top/https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://ghfast.top/https://github.com/espressif/arduino-esp32.git#3.3.11

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_src_filter = +<*>

[env:echo-pod]
; 正式版（默认）

[env:echo-pod-debug]
build_flags =
    ${env.build_flags}
    -DPOD_DEBUG=1
