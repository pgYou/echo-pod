; PlatformIO Project Configuration File
; 录音豆 echo-pod 固件 —— 2.0 硬件：微雪 ESP32-S3-ePaper-1.54（V2，N8R8）
;
; 框架：arduino-esp32 3.3.11 + ghfast.top 镜像 + 8MB OPI PSRAM
; 板级引脚与交互定义见 docs（hardware-spec / interaction-design）
;
; USB 栈（v0.2.0 TinyUSB 复合设备：CDC 串口 + MSC 只读 U 盘）：
;   ARDUINO_USB_MODE=0  切 TinyUSB（1=硬件 CDC，无 MSC 能力）。编译时
;   "ARDUINO_USB_MODE redefined" 警告属预期（板卡预置 =1 在前，此处 =0
;   在后生效）——若 =1 生效则 USB 对象不存在，编译必失败，成功即自证
;   MSC 接口注册时机：pod_usb.cpp 的全局 USBMSC 对象构造先于 app_main 的
;   USB.begin()（全局构造 → app_main → setup），复合描述符 CDC+MSC 一次成型；
;   ARDUINO_USB_ON_BOOT 无需干预（USB.h 中该宏为无保护表达式重定义，
;   -D 覆盖不了，靠构造时序取胜）
;
; 两个 env，同一份 src：
;   echo-pod        正式版：插电脑 → SYNC 态（切段收尾后挂只读 U 盘 + CDC）
;   echo-pod-debug  调试版：插线仅=供电+串口，永不进 SYNC，录音/日志不中断
;                   （编译期 POD_DEBUG=1，烧录加 -e echo-pod-debug）

[env]
; 用 ghfast.top 镜像加速 github 下载（国内可直连）
platform = https://ghfast.top/https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://ghfast.top/https://github.com/espressif/arduino-esp32.git#3.3.11

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_src_filter = +<*>

[env:echo-pod]
; 正式版（默认）

[env:echo-pod-debug]
build_flags =
    ${env.build_flags}
    -DPOD_DEBUG=1
